server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-pedidos
  # Local default: in-memory H2. In AWS set DB_URL/DB_USER/DB_PASSWORD to the RDS PostgreSQL instance.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  # Clúster RabbitMQ (dos nodos). En AWS: RABBIT_ADDRESSES=<ip privada>:5672,<ip privada>:5673
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}
    connection-timeout: 3s
    # El broker confirma cada publicación y devuelve los mensajes que no llegan a ninguna cola.
    publisher-confirm-type: correlated
    publisher-returns: true

app:
  security:
    cognito:
      issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_CHANGEME}
      client-ids: ${COGNITO_CLIENT_ID:CHANGEME}
      default-role: CLIENTE

  # Internal URL of ms-productos (same EC2 host in AWS).
  productos-url: ${PRODUCTOS_URL:http://localhost:8081}

  pagos:
    # Comma separated; the first one is the default return target after Webpay.
    frontend-origins: ${FRONTEND_ORIGINS:http://localhost:4200}
    webpay:
      # Transbank integration (sandbox) environment. The commerce code and key below are the public
      # test credentials published by Transbank; production values must come from the environment.
      base-url: ${WEBPAY_BASE_URL:https://webpay3gint.transbank.cl}
      commerce-code: ${WEBPAY_COMMERCE_CODE:597055555532}
      api-key: ${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
      return-url: ${WEBPAY_RETURN_URL:http://localhost:8082/api/pagos/webpay/retorno}

# Nombres de mensajería en un solo lugar (ver MensajeriaProperties).
mensajeria:
  exchanges:
    eventos: pedidos.eventos
    comandos: pedidos.comandos
  routing-keys:
    pedido-creado: pedido.creado
    pedido-estado: pedido.estado
    pago-aprobado: pago.aprobado
    pago-rechazado: pago.rechazado
    generar-comprobante: comprobante.generar

management:
  # La salud de ms-pedidos no depende de RabbitMQ: si la mensajería cae, los pedidos siguen funcionando.
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
