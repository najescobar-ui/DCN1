# Streaming de Pedidos360: ensemble de 3 Zookeeper, 3 brokers Kafka, Kafka UI y los microservicios que lo usan.
# Uso (en la EC2 de streaming): docker compose up -d --build
#
# Listeners de cada broker:
#   INTERNAL  kafkaN:29092         tráfico entre brokers y con los contenedores de esta red (Kafka UI, ms-analitica,
#                                  ms-streaming-admin). Es el listener inter-broker.
#   EXTERNAL  ${KAFKA_HOST}:909N   lo que se anuncia a los clientes de fuera del compose: ms-pedidos, en la EC2
#                                  backend, se conecta a la IP privada de esta EC2. El security group solo abre
#                                  9092-9094 a la EC2 backend; nunca a internet.
name: pedidos360-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.9.1
  restart: unless-stopped
  healthcheck:
    # "srvr" es uno de los comandos de cuatro letras habilitados abajo; responde Mode: leader/follower.
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2181; echo srvr >&3; grep -q Mode <&3'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 15s

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Los tres miembros del ensemble (puerto 2888: réplica de datos; 3888: elección de líder).
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat,mntr
  KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.9.1
  restart: unless-stopped
  depends_on:
    zookeeper1: { condition: service_healthy }
    zookeeper2: { condition: service_healthy }
    zookeeper3: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Durabilidad coherente con 3 réplicas: una escritura con acks=all necesita 2 réplicas en sincronía,
  # así el clúster tolera la caída de un broker sin perder datos ni dejar de aceptar escrituras.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  # Tópicos internos (offsets de los consumer groups y transacciones) también con 3 réplicas.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  # Los tópicos se crean de forma explícita (NewTopic en ms-analitica o ms-streaming-admin), nunca por accidente.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Nunca se elige como líder una réplica desactualizada: se prefiere no escribir a perder eventos.
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms384m -Xmx512m

x-java: &java
  restart: unless-stopped
  build:
    context: .
    dockerfile: Dockerfile.java
  depends_on:
    kafka1: { condition: service_healthy }
    kafka2: { condition: service_healthy }
    kafka3: { condition: service_healthy }

services:
  zookeeper1:
    <<: *zookeeper
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes: [zk1-data:/var/lib/zookeeper/data, zk1-log:/var/lib/zookeeper/log]

  zookeeper2:
    <<: *zookeeper
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes: [zk2-data:/var/lib/zookeeper/data, zk2-log:/var/lib/zookeeper/log]

  zookeeper3:
    <<: *zookeeper
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes: [zk3-data:/var/lib/zookeeper/data, zk3-log:/var/lib/zookeeper/log]

  kafka1:
    <<: *kafka
    hostname: kafka1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_BROKER_RACK: r1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_HOST}:9092
    volumes: [kafka1-data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    hostname: kafka2
    ports: ["9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_BROKER_RACK: r2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_HOST}:9093
    volumes: [kafka2-data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    hostname: kafka3
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_BROKER_RACK: r3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_HOST}:9094
    volumes: [kafka3-data:/var/lib/kafka/data]

  # Administración y monitoreo: brokers, tópicos, particiones, mensajes, consumer groups, offsets y lag.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports: ["8090:8080"]
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      # La consola pide usuario y clave (valores en .env, fuera de git).
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
      JAVA_OPTS: -Xms128m -Xmx384m

  ms-analitica:
    <<: *java
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR: jars/ms-analitica.jar }
    ports: ["8085:8085"]
    environment:
      PORT: 8085
      JAVA_OPTS: -Xms128m -Xmx320m
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}

  ms-streaming-admin:
    <<: *java
    build:
      context: .
      dockerfile: Dockerfile.java
      args: { JAR: jars/ms-streaming-admin.jar }
    ports: ["8086:8086"]
    environment:
      PORT: 8086
      JAVA_OPTS: -Xms128m -Xmx256m
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
