# Configuración común de los dos nodos RabbitMQ de Pedidos360.
# El clúster se forma solo al arrancar: cada nodo conoce la lista de pares (peer discovery clásico).
cluster_name = pedidos360-mq
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Límite de memoria fijo: comparten una t3.medium con dos microservicios Java.
vm_memory_high_watermark.absolute = 512MiB
disk_free_limit.absolute = 1GB

# Las colas nuevas son quorum por defecto: se replican entre los dos nodos.
default_queue_type = quorum
